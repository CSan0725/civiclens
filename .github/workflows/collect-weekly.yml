name: collect-weekly

# Weekly roster refresh into the Neon database.
#
# PRD §7 schedule: 의원명부 = 주 단위 (the member roster, weekly). Membership
# changes at the rate of resignations, deaths and special elections — daily
# collection would spend ~537 requests a day to observe nothing.
#
# Votes and bills move daily and run in collect-daily.yml.

on:
  schedule:
    # 06:41 UTC Sunday. Off-hour and off-minute on purpose: GitHub delays
    # schedules that land on popular round times.
    - cron: "41 6 * * 0"
  workflow_dispatch:
    inputs:
      congress:
        description: Congress to collect (blank = whichever is sitting today)
        required: false
        default: ""
      limit:
        description: Max members per run (blank = the whole roster)
        required: false
        default: ""

concurrency:
  group: collect-weekly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipelines/etl

    env:
      # Direct (unpooled) endpoint — bulk upserts must not go through
      # PgBouncer transaction pooling.
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
      CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
      ETL_LOG_LEVEL: INFO
      CONGRESS_ARG: ${{ inputs.congress && format('--congress {0}', inputs.congress) || '' }}
      LIMIT_ARG: ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pipelines/etl/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: Verify secrets are present
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL_UNPOOLED secret is not set."; exit 1
          fi
          if [ -z "$CONGRESS_GOV_API_KEY" ]; then
            echo "::error::CONGRESS_GOV_API_KEY secret is not set."; exit 1
          fi

      # Two passes by necessity: the roster endpoint carries only full state
      # names and no congress numbers, so each member's detail record is
      # fetched for stateCode and the per-Congress term history.
      - name: Members and terms
        run: uv run civiclens-etl members $CONGRESS_ARG $LIMIT_ARG

      - name: Report freshness
        if: always()
        run: |
          uv run python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c, c.cursor() as cur:
              cur.execute("""
                  select dataset, last_status, rows_upserted, last_success_at
                  from dataset_sync_state order by dataset
              """)
              print(f"{'dataset':<14}{'status':<9}{'rows':>7}  last_success_at")
              for d, st, rows, ok_at in cur.fetchall():
                  print(f"{d:<14}{st or '-':<9}{rows if rows is not None else 0:>7}  {ok_at}")
              cur.execute("select count(*) from member")
              members = cur.fetchone()[0]
              cur.execute("select count(*) from term")
              print(f"\nmember {members:,d} · term {cur.fetchone()[0]:,d}")
          PY

      - name: Open an issue on failure
        if: failure()
        uses: ./.github/actions/report-etl-failure
        with:
          job-name: weekly
