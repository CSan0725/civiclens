name: ci-etl

# Path-filtered per Deployment-Architecture-Report §4.
#
# NO LIVE UPSTREAM CALLS. Every HTTP request is intercepted by respx and served
# from fixtures captured during P1 verification, so CI cannot be broken by an
# upstream outage, a rate limit, or a WAF, and no API key is needed to run it.
# The integration tests do need a real Postgres — partition routing, generated
# tsvector columns and expression-index upserts are exactly the things a mock
# would not catch — so a PostGIS service is provided and migrated.

on:
  push:
    branches: [main]
    paths:
      - "pipelines/etl/**"
      - "packages/db/migrations/**"
      - ".github/workflows/ci-etl.yml"
  pull_request:
    paths:
      - "pipelines/etl/**"
      - "packages/db/migrations/**"
      - ".github/workflows/ci-etl.yml"
  workflow_dispatch:

concurrency:
  group: ci-etl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civiclens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d civiclens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # sslmode=disable is required, not cosmetic: dbmate's Postgres driver
      # (lib/pq) defaults to requiring TLS, and the service container serves
      # plaintext, so omitting it fails with "pq: SSL is not enabled on the
      # server" before a single migration runs.
      CIVICLENS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/civiclens_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pipelines/etl/uv.lock

      - name: Install
        working-directory: pipelines/etl
        run: uv sync --frozen

      - name: Ruff (lint)
        working-directory: pipelines/etl
        run: uv run ruff check .

      - name: Ruff (format)
        working-directory: pipelines/etl
        run: uv run ruff format --check .

      - name: mypy
        working-directory: pipelines/etl
        run: uv run mypy

      # The integration tests write to the real schema, so it has to exist.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install migration tooling
        run: pnpm install --frozen-lockfile
      - name: Apply migrations to the test database
        env:
          DATABASE_URL_UNPOOLED: ${{ env.CIVICLENS_TEST_DATABASE_URL }}
        run: |
          touch .env
          pnpm --filter @civiclens/db run up

      - name: pytest
        working-directory: pipelines/etl
        run: uv run pytest -q
