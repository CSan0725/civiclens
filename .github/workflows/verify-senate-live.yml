name: verify-senate-live

# One-off access probe, NOT a collection job.
#
# senate.gov sits behind Akamai, which returned 403 to this project's honest
# User-Agent from the development network during P1 verification, while
# accepting a browser UA. The default was deliberately left honest (see
# docs/P1-source-verification.md, Finding 7), on the theory that the block may
# be IP-related and a US-hosted runner would be allowed through.
#
# This workflow settles that question. It fetches ONE real roll call through
# the exact code path the collector uses — same module, same client, same
# default User-Agent — parses it, and prints the counts.
#
# It deliberately does NOT write to the database. This measures reachability,
# not ingestion, so it needs no secrets and no service container.
#
# Manual dispatch only: nothing here should run on a schedule or on push.

on:
  workflow_dispatch:
    inputs:
      congress:
        description: Congress number
        required: false
        default: "119"
      session:
        description: Session (1 or 2)
        required: false
        default: "2"
      roll_number:
        description: >-
          Specific roll call to fetch (blank = newest). Use this to capture a
          known amendment vote, e.g. 119/1/64 is "On the Amendment S.Amdt. 473
          to S.Con.Res. 7".
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines/etl

    steps:
      - uses: actions/checkout@v7

      # Exact pin: setup-uv stopped publishing major and minor tags at
      # v8, so `@v10` does not resolve. Bump this line deliberately.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: pipelines/etl/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: Probe senate.gov through the collector
        env:
          CONGRESS: ${{ inputs.congress }}
          SESSION: ${{ inputs.session }}
          ROLL: ${{ inputs.roll_number }}
        run: |
          uv run python - <<'PY'
          import os
          import sys

          from common.logging import configure_logging
          from common.settings import get_settings
          from sources import legislators, senate_xml
          from sources.base import SourceError

          configure_logging("INFO")
          congress = int(os.environ["CONGRESS"])
          session = int(os.environ["SESSION"])
          settings = get_settings()

          print(f"congress={congress} session={session}")
          print(f"User-Agent in use: {settings.senate_user_agent!r}")
          print("(this is the shipped default unless SENATE_USER_AGENT is set)")
          print()

          try:
              with senate_xml.open_fetcher() as fetcher:
                  menu = senate_xml.fetch_vote_menu(
                      fetcher, congress=congress, session=session
                  )
                  print(f"MENU  {menu.status_code}  {len(menu.payload):,} bytes  {menu.source_url}")

                  listed = senate_xml.parse_vote_menu(menu.payload)
                  print(f"MENU  parsed {len(listed)} roll calls")
                  if not listed:
                      print("::error::menu parsed but contained no roll calls")
                      sys.exit(1)

                  requested = os.environ.get("ROLL", "").strip()
                  if requested:
                      roll = int(requested)
                      print(f"MENU  requested roll call: #{roll}")
                  else:
                      newest = max(listed, key=lambda v: v["roll_number"])
                      roll = int(newest["roll_number"])
                      print(f"MENU  newest roll call: #{roll} — {newest.get('question')}")
                  print()

                  vote = senate_xml.fetch_vote(
                      fetcher, congress=congress, session=session, roll_number=roll
                  )
                  print(f"VOTE  {vote.status_code}  {len(vote.payload):,} bytes  {vote.source_url}")

              # The <document> and <amendment> elements, verbatim.
              #
              # Amendment roll calls do not link to their parent measure and we
              # cannot see why from the development network: senate.gov answers
              # 403 there, so the field names have to be read off a real
              # payload rather than guessed. Printed raw, and the whole XML is
              # uploaded as an artifact so it can be committed as a fixture
              # byte-for-byte.
              import re

              text = vote.payload.decode("utf-8", "replace")
              for tag in ("document", "amendment"):
                  m = re.search(rf"<{tag}>.*?</{tag}>", text, re.S)
                  print()
                  print(f"RAW <{tag}> ---------------------------------------------")
                  print(m.group(0) if m else f"(no <{tag}> element present)")
              print()
              print("RAW <vote_question_text>:", re.search(r"<vote_question_text>(.*?)</vote_question_text>", text, re.S).group(1).strip() if re.search(r"<vote_question_text>(.*?)</vote_question_text>", text, re.S) else "(absent)")
              print("RAW <vote_title>:", re.search(r"<vote_title>(.*?)</vote_title>", text, re.S).group(1).strip() if re.search(r"<vote_title>(.*?)</vote_title>", text, re.S) else "(absent)")
              print()

              out = f"senate_vote_{congress}_{session}_{roll:05d}.xml"
              with open(out, "wb") as fh:
                  fh.write(vote.payload)
              print(f"WROTE {out} ({len(vote.payload):,} bytes) for artifact upload")

              row = senate_xml.parse_vote(vote.payload, source_url=vote.source_url)
              print(
                  "VOTE  parsed: "
                  f"{row['congress_no']}-{row['session']} roll {row['roll_number']} "
                  f"on {row['vote_date']} — {row['result']!r} "
                  f"({row['yea_count']}-{row['nay_count']}, {row['required_majority']} required)"
              )

              with legislators.open_fetcher() as cw_fetcher:
                  crosswalk = legislators.load_lis_crosswalk(cw_fetcher)
              print(f"CROSSWALK  {len(crosswalk)} lis_id -> bioguide_id entries")

              casts, unresolved, raw_values = senate_xml.parse_vote_members(
                  vote.payload,
                  vote_id=0,
                  congress_no=row["congress_no"],
                  source_url=vote.source_url,
                  lis_crosswalk=crosswalk,
              )
              positions: dict[str, int] = {}
              for c in casts:
                  # position is None when the cast is outside the enum; the
                  # source string is kept in raw_position (migration 0003).
                  key = c["position"] or f"raw:{c['raw_position']}"
                  positions[key] = positions.get(key, 0) + 1

              print(f"CASTS  resolved {len(casts)}, unresolved {len(unresolved)}")
              print(f"CASTS  positions: {positions}")
              if unresolved:
                  print(f"CASTS  unresolved lis ids: {sorted(set(unresolved))}")
              if raw_values:
                  print(f"CASTS  non-enum positions recorded verbatim: {raw_values}")

              print()
              print("RESULT: senate.gov is REACHABLE from this runner with the honest User-Agent.")
              print("Nothing was written to a database — this probe is read-only.")

          except SourceError as exc:
              message = str(exc)
              print()
              if "403" in message:
                  print("RESULT: senate.gov returned 403 — the WAF rejects this User-Agent here too.")
                  print("Do NOT spoof a browser UA without an explicit decision; see")
                  print("docs/P1-source-verification.md (Finding 7).")
              else:
                  print("RESULT: senate.gov request failed for a reason other than the WAF.")
              print(f"::error::{message[:500]}")
              sys.exit(1)
          PY

      # Byte-for-byte, so it can be committed straight into
      # pipelines/etl/tests/fixtures/ (see .gitattributes: fixtures are -text).
      - name: Upload the raw roll call XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senate-vote-xml
          path: pipelines/etl/senate_vote_*.xml
          if-no-files-found: warn
