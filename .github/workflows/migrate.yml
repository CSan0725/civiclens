name: migrate

# Applies pending migrations to a real database.
#
# MANUAL DISPATCH ONLY, on purpose. Deployment-Architecture-Report §4: a
# dedicated migration job — not the app deploy, not the ETL — owns this, and it
# must run BEFORE the app deploys and before any ETL job, so neither meets a
# schema that has not been applied yet.
#
# Prerequisites:
#   - Repository environment `production` (or `staging`) exists, ideally with a
#     required reviewer.
#   - Secret DATABASE_URL_UNPOOLED_OWNER is set. Use the DIRECT Neon endpoint:
#     DDL must not go through PgBouncer transaction pooling.
#
# WHY A SECOND SECRET NAME
# ------------------------
# 0010 split the single owner connection into `webapp` and `etl_writer`, and
# the point of that split is that a runtime credential cannot alter the schema
# it reads. This job is the exception that must keep DDL rights — so it must
# NOT share a credential with collect-daily, collect-weekly, collect-speeches
# and collect-candidates, all four of which read `secrets.DATABASE_URL_UNPOOLED`
# at repository scope and should be carrying etl_writer.
#
# Until DATABASE_URL_UNPOOLED_OWNER exists this falls back to the old secret, so
# nothing breaks in the meantime; the `Verify target` step below says out loud
# which one it got. Once the owner secret is set, repoint the repository-scoped
# DATABASE_URL_UNPOOLED at etl_writer and the separation is real.

# The run list is where someone checks whether the database was migrated, so the
# run's own title has to answer that. A dry run and a real one are otherwise
# indistinguishable there: both finish green.
run-name: >-
  migrate ${{ inputs.environment }}
  ${{ inputs.dry_run && '(dry run — applies nothing)' || '(APPLYING)' }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: environment
        required: true
        default: production
      dry_run:
        description: Only report pending migrations, do not apply them
        type: boolean
        required: false
        default: true

concurrency:
  group: migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      # The OWNER credential (see WHY A SECOND SECRET NAME above). The variable
      # name on the left is fixed: packages/db passes --env DATABASE_URL_UNPOOLED
      # to dbmate.
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_OWNER || secrets.DATABASE_URL_UNPOOLED }}
      OWNER_SECRET_SET: ${{ secrets.DATABASE_URL_UNPOOLED_OWNER != '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify target is configured
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Neither DATABASE_URL_UNPOOLED_OWNER nor DATABASE_URL_UNPOOLED is set for environment '${{ inputs.environment }}'."
            exit 1
          fi
          if [ "$OWNER_SECRET_SET" = "true" ]; then
            echo "Using DATABASE_URL_UNPOOLED_OWNER."
          else
            echo "::warning title=Sharing the collectors' credential::DATABASE_URL_UNPOOLED_OWNER is not set, so this run fell back to DATABASE_URL_UNPOOLED — the same secret collect-daily, collect-weekly, collect-speeches and collect-candidates use. Migrations therefore run on whatever role those jobs carry, and if that role is etl_writer this run will fail on the first CREATE TABLE. Set the owner secret."
          fi

      - name: Provide empty dotenv
        run: touch .env

      - name: Pending migrations
        run: pnpm --filter @civiclens/db run status

      # A dry run is the default, and it finishes green having changed nothing —
      # which reads in the run list exactly like a migration that was applied. It
      # was read that way once: `migrate` showed success, 0004 was still pending,
      # and the deployed app served an empty dashboard against the old schema.
      # Cheaper to say so here than to diagnose it from the outside again.
      - name: Say that a dry run applied nothing
        if: ${{ inputs.dry_run }}
        run: |
          echo "::warning title=Dry run::Nothing was applied. Re-run with 'Only report pending migrations' UNCHECKED to apply the migrations listed above."
          {
            echo "### Dry run — no migrations were applied"
            echo
            echo "Any migration listed as pending in the \`Pending migrations\` step is"
            echo "still pending. Re-run this workflow with **dry_run unchecked** to apply it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: ${{ !inputs.dry_run }}
        run: pnpm --filter @civiclens/db run up

      - name: Final status
        if: ${{ !inputs.dry_run }}
        run: pnpm --filter @civiclens/db run status

      - name: Record that migrations were applied
        if: ${{ !inputs.dry_run }}
        run: |
          {
            echo "### Migrations applied to \`${{ inputs.environment }}\`"
            echo
            echo "The \`Final status\` step above lists the schema as it now stands."
          } >> "$GITHUB_STEP_SUMMARY"
