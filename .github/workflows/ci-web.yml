name: ci-web

# Path-filtered per Deployment-Architecture-Report §4: only the affected
# workspace runs. Deployment is NOT wired up yet — that lands with the Vercel
# connection in a later step.
#
# The build step exists to catch static-generation failures at PR time. Most of
# this app's pages are prerendered (`next build` runs them), so a broken
# server component fails the build rather than lint or tsc — neither of which
# executes a page. `getDb()` is lazy precisely so the build needs no database.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @civiclens/web run lint

      - name: Typecheck
        run: pnpm --filter @civiclens/web run typecheck

      # NO LIVE UPSTREAM CALLS and no database, matching the rule ci-etl states
      # for the Python suite: Census responses come from captured fixtures and
      # the queries are mocked, so CI cannot be broken by an outage or by Neon
      # being asleep. Runs before Build because it is seconds, not minutes.
      - name: Test
        run: pnpm --filter @civiclens/web run test

      - name: Build
        run: pnpm --filter @civiclens/web run build
