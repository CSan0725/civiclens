name: Report ETL failure
description: >
  Open (or update) a GitHub Issue when a scheduled collection run fails.
  GitHub Actions does not notify anyone when a `schedule:` workflow fails, so
  without this a broken nightly job stays broken silently — the gap both the
  README and Deployment-Architecture-Report §4 call out.

inputs:
  job-name:
    description: Which collection job failed (e.g. "daily", "weekly").
    required: true
  token:
    description: "Token with issues: write permission."
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.token }}
        script: |
          const job = ${{ toJSON(inputs['job-name']) }};
          const label = 'etl-failure';
          const title = `Scheduled collection failed: ${job}`;
          const runUrl =
            `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
            `/actions/runs/${context.runId}`;
          const body = [
            `Run: ${runUrl}`,
            `Workflow: \`${context.workflow}\``,
            `Job: \`${job}\``,
            `Commit: ${context.sha}`,
            `Triggered by: \`${context.eventName}\``,
            '',
            'Check `dataset_sync_state` for which datasets last succeeded — a',
            'failed job records `last_status = \'failed\'` with the error in',
            '`message`, so the database says what broke even when the logs have',
            'expired.',
          ].join('\n');

          // Make sure the label exists; creating an issue with an unknown
          // label fails the whole step.
          try {
            await github.rest.issues.getLabel({ ...context.repo, name: label });
          } catch (e) {
            if (e.status !== 404) throw e;
            await github.rest.issues.createLabel({
              ...context.repo,
              name: label,
              color: 'b60205',
              description: 'A scheduled ETL run failed',
            });
          }

          // Reuse an open issue for the same job rather than filing a fresh one
          // every night — a persistent failure would otherwise produce 30
          // issues a month and train everyone to ignore them.
          const { data: open } = await github.rest.issues.listForRepo({
            ...context.repo,
            state: 'open',
            labels: label,
            per_page: 100,
          });
          const existing = open.find((i) => i.title === title);

          if (existing) {
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: existing.number,
              body: `Failed again.\n\n${body}`,
            });
            core.warning(`Updated existing issue #${existing.number} for "${title}".`);
          } else {
            const { data: created } = await github.rest.issues.create({
              ...context.repo,
              title,
              body,
              labels: [label],
            });
            core.warning(`Opened issue #${created.number} for "${title}".`);
          }
